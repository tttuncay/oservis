# =====================================================================================
# Google Cloud Build Pipeline for Oservis API
# Builds container image and deploys to Google Cloud Run with WebSocket/SignalR support
# =====================================================================================

steps:
  # 1. Build Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/oservis-api:$SHORT_SHA'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/oservis-api:latest'
      - '-f'
      - 'src/backend/Dockerfile'
      - 'src/backend'

  # 2. Push Image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/oservis-api'

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'oservis-api'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/oservis-api:$SHORT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--session-affinity' # Critical for SignalR & WebSocket stability
      - '--set-env-vars=ASPNETCORE_ENVIRONMENT=Production'
      - '--set-secrets=ConnectionStrings__DefaultConnection=OSERVIS_DB_CONNECTION:latest,JwtSettings__Secret=OSERVIS_JWT_SECRET:latest'

substitutions:
  _REGION: 'europe-west3' # Frankfurt or europe-west1
  _REPO_NAME: 'oservis-repo'

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/oservis-api:$SHORT_SHA'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/oservis-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
